spring.application.name=SeaOfTales

spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
logging.level.org.springframework.web=info

spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true


spring.mail.host=smtp.zoho.in
spring.mail.port=587
spring.mail.username=noreply@easternwordsmith.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=noreply@easternwordsmith.com
spring.mail.from-name=Sea of Tales
spring.mail.password=${SEAOFTALES_MAIL_PASSWORD}
seaoftales.contact.recipient=${SEAOFTALES_CONTACT_RECIPIENT:contact@easternwordsmith.com}
seaoftales.public-base-url=${SEAOFTALES_PUBLIC_BASE_URL:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
