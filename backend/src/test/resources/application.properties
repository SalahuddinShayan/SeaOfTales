spring.application.name=SeaOfTales-test
spring.profiles.default=test
spring.datasource.url=jdbc:h2:mem:seaoftales_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.SQL=OFF
spring.mail.password=test-only
seaoftales.storage.location=${java.io.tmpdir}/seaoftales-test-images
